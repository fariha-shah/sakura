<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Sakura — User Profile</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/sakura-theme.css" />
    <style>
      .profile-container {
        max-width: 960px;
        margin: 0 auto;
        padding: 80px 20px 80px;
      }

      .profile-hero-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        overflow: hidden;
        box-shadow: var(--shadow-sm);
        margin-bottom: 24px;
        position: relative;
      }

      .cover-area {
        height: 240px;
        background: linear-gradient(135deg, #fbcfe8 0%, #f472b6 50%, #db2777 100%);
        position: relative;
        overflow: hidden;
      }

      [data-theme="dark"] .cover-area {
        background: linear-gradient(135deg, #1e1b2e 0%, #372045 50%, #581c3f 100%);
      }

      .cover-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        inset: 0;
      }

      .profile-info-bar {
        padding: 0 28px 24px;
        position: relative;
      }

      .profile-avatar-row {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        margin-top: -55px;
        margin-bottom: 16px;
        flex-wrap: wrap;
        gap: 16px;
      }

      .profile-dp-wrap {
        position: relative;
        width: 110px;
        height: 110px;
        border-radius: 50%;
        border: 4px solid var(--bg-card);
        background: var(--pink-gradient);
        box-shadow: var(--shadow-md);
        overflow: hidden;
        flex-shrink: 0;
      }

      .profile-dp-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .profile-dp-initials {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 40px;
        font-weight: 700;
      }

      .btn-follow-toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 9px 22px;
        border-radius: var(--radius-full);
        background: var(--pink-gradient);
        color: white;
        border: none;
        font-family: inherit;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: var(--sakura-glow);
        transition: var(--transition);
      }

      .btn-follow-toggle.following {
        background: #10b981;
        box-shadow: 0 4px 16px rgba(16, 185, 129, 0.25);
      }

      .profile-name-text {
        font-size: 24px;
        font-weight: 800;
        color: var(--text-main);
        letter-spacing: -0.4px;
      }

      .profile-handle-text {
        font-size: 14px;
        color: var(--text-muted);
        margin-bottom: 12px;
      }

      .profile-bio-box {
        font-size: 14.5px;
        color: var(--text-main);
        line-height: 1.5;
        margin-bottom: 20px;
        max-width: 680px;
        white-space: pre-line;
      }

      .profile-stats-row {
        display: flex;
        gap: 28px;
        align-items: center;
      }

      .profile-stat-box {
        display: flex;
        align-items: baseline;
        gap: 6px;
      }

      .profile-stat-val {
        font-size: 18px;
        font-weight: 800;
        color: var(--text-main);
      }

      .profile-stat-lbl {
        font-size: 13px;
        color: var(--text-muted);
      }

      .posts-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .post-card {
        background: var(--bg-card);
        border-radius: var(--radius-lg);
        padding: 20px;
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow-sm);
      }

      .post-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }

      .post-avatar {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--pink-gradient);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 16px;
        overflow: hidden;
      }

      .post-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .post-content {
        font-size: 15px;
        line-height: 1.6;
        color: var(--text-main);
        margin-bottom: 12px;
        white-space: pre-line;
      }

      .post-image {
        width: 100%;
        max-height: 480px;
        border-radius: var(--radius-md);
        object-fit: cover;
        cursor: pointer;
        margin-bottom: 12px;
        border: 1px solid var(--border-color);
      }

      .post-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-top: 10px;
        border-top: 1px solid var(--border-color);
      }

      .action-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border-radius: var(--radius-full);
        background: transparent;
        border: none;
        color: var(--text-muted);
        font-size: 13px;
        font-weight: 600;
      }

      @media (max-width: 768px) {
        .profile-container {
          padding: 68px 12px 80px;
        }
        .cover-area {
          height: 170px;
        }
        .profile-info-bar {
          padding: 0 16px 20px;
        }
        .profile-dp-wrap {
          width: 86px;
          height: 86px;
          margin-top: -43px;
        }
        .profile-name-text {
          font-size: 20px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Hidden SVG Symbols -->
    <svg style="display: none" xmlns="http://www.w3.org/2000/svg">
      <symbol id="i-aperture" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="14.31" y1="8" x2="20.05" y2="17.94"/><line x1="9.69" y1="8" x2="21.17" y2="8"/><line x1="7.38" y1="12" x2="13.12" y2="2.06"/><line x1="9.69" y1="16" x2="3.95" y2="6.06"/><line x1="14.31" y1="16" x2="2.83" y2="16"/><line x1="16.62" y1="12" x2="10.88" y2="21.94"/></symbol>
      <symbol id="i-arrow-left" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></symbol>
      <symbol id="i-userplus" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></symbol>
      <symbol id="i-comment" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
    </svg>

    <!-- Top Navbar -->
    <nav class="navbar">
      <a class="nav-brand" href="feed.html">
        <div class="nav-brand-icon">
          <svg class="ico"><use href="#i-aperture" /></svg>
        </div>
        Sakura
      </a>

      <div class="nav-actions">
        <button class="nav-icon-btn" onclick="window.location='feed.html'" title="Back to Feed">
          <svg class="ico"><use href="#i-arrow-left" /></svg>
        </button>

        <button class="nav-icon-btn" onclick="toggleTheme()" title="Toggle Theme">
          <svg class="ico"><use class="theme-icon-use" href="#i-moon" /></svg>
        </button>
      </div>
    </nav>

    <!-- Main Profile Container -->
    <main class="profile-container">
      <section class="profile-hero-card">
        <!-- Cover Area -->
        <div class="cover-area">
          <img class="cover-img" id="targetCoverImg" style="display: none;" alt="Cover" />
        </div>

        <!-- Info Bar -->
        <div class="profile-info-bar">
          <div class="profile-avatar-row">
            <div class="profile-dp-wrap">
              <div class="profile-dp-initials" id="targetInitials">?</div>
              <img class="profile-dp-img" id="targetDpImg" style="display: none;" alt="Avatar" />
            </div>

            <div id="targetActionWrap">
              <button class="btn-follow-toggle" id="btnFollowToggle" onclick="handleToggleFollow()">
                <svg class="ico ico-sm"><use href="#i-userplus" /></svg>
                <span>Follow</span>
              </button>
            </div>
          </div>

          <h1 class="profile-name-text" id="targetName">Loading...</h1>
          <div class="profile-handle-text" id="targetHandle">@...</div>
          <p class="profile-bio-box" id="targetBio"></p>

          <div class="profile-stats-row">
            <div class="profile-stat-box">
              <span class="profile-stat-val" id="targetPostsCount">0</span>
              <span class="profile-stat-lbl">Posts</span>
            </div>
            <div class="profile-stat-box">
              <span class="profile-stat-val" id="targetFollowersCount">0</span>
              <span class="profile-stat-lbl">Followers</span>
            </div>
            <div class="profile-stat-box">
              <span class="profile-stat-val" id="targetFollowingCount">0</span>
              <span class="profile-stat-lbl">Following</span>
            </div>
          </div>
        </div>
      </section>

      <!-- Posts List -->
      <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 16px; color: var(--text-main);">Posts</h2>
      <div id="targetPostsStream">
        <div class="loading-spinner"></div>
      </div>
    </main>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <a class="bottom-nav-item" href="feed.html">
        <svg class="ico"><use href="#i-home" /></svg>
        <span>Home</span>
      </a>
      <a class="bottom-nav-item active" href="profile.html">
        <svg class="ico"><use href="#i-user" /></svg>
        <span>Profile</span>
      </a>
    </nav>

    <script src="/js/sakura-core.js"></script>
    <script>
      checkAuth(true);
      createPetals(5);

      const urlParams = new URLSearchParams(window.location.search);
      const targetUserId = urlParams.get('id');

      if (!targetUserId) {
        window.location.href = 'feed.html';
      }

      const myUser = getUser();
      let isFollowingTarget = false;

      // If own ID, redirect to profile.html
      if (targetUserId === myUser._id) {
        window.location.href = 'profile.html';
      }

      async function loadTargetProfile() {
        try {
          const res = await fetch(`/api/users/id/${targetUserId}`, { headers: authHeaders() });
          if (!res.ok) throw new Error('User not found');
          const target = await res.json();
          renderTargetProfile(target);
          checkTargetFollowStatus();
          loadTargetPosts();
        } catch (e) {
          document.getElementById('targetName').textContent = 'User not found';
          showToast('Could not load user profile', 'error');
        }
      }

      function renderTargetProfile(u) {
        document.title = `Sakura — ${u.fullName}`;
        document.getElementById('targetName').textContent = u.fullName || 'User';
        document.getElementById('targetHandle').textContent = '@' + (u.username || '');
        document.getElementById('targetBio').textContent = u.bio || 'Living life in full blossom 🌸';
        document.getElementById('targetFollowersCount').textContent = u.followersCount || 0;
        document.getElementById('targetFollowingCount').textContent = u.followingCount || 0;

        const initials = u.fullName?.[0]?.toUpperCase() || '?';
        const dpImg = document.getElementById('targetDpImg');
        const dpInitials = document.getElementById('targetInitials');

        if (u.profilePicture) {
          dpImg.src = u.profilePicture;
          dpImg.style.display = 'block';
          dpInitials.style.display = 'none';
        } else {
          dpImg.style.display = 'none';
          dpInitials.textContent = initials;
          dpInitials.style.display = 'flex';
        }

        const coverImg = document.getElementById('targetCoverImg');
        if (u.coverPhoto) {
          coverImg.src = u.coverPhoto;
          coverImg.style.display = 'block';
        }
      }

      async function checkTargetFollowStatus() {
        try {
          const res = await fetch(`/api/users/${targetUserId}/isfollowing`, { headers: authHeaders() });
          const data = await res.json();
          isFollowingTarget = !!data.isFollowing;
          renderFollowBtn();
        } catch (e) {}
      }

      function renderFollowBtn() {
        const btn = document.getElementById('btnFollowToggle');
        if (isFollowingTarget) {
          btn.classList.add('following');
          btn.innerHTML = `<svg class="ico ico-sm"><use href="#i-check"/></svg><span>Following</span>`;
        } else {
          btn.classList.remove('following');
          btn.innerHTML = `<svg class="ico ico-sm"><use href="#i-userplus"/></svg><span>Follow</span>`;
        }
      }

      async function handleToggleFollow() {
        const btn = document.getElementById('btnFollowToggle');
        btn.disabled = true;

        const method = isFollowingTarget ? 'DELETE' : 'POST';
        try {
          const res = await fetch(`/api/users/${targetUserId}/follow`, {
            method,
            headers: authHeaders(),
          });
          const data = await res.json();
          if (res.ok) {
            isFollowingTarget = !isFollowingTarget;
            renderFollowBtn();
            const followersEl = document.getElementById('targetFollowersCount');
            const count = parseInt(followersEl.textContent) || 0;
            followersEl.textContent = isFollowingTarget ? count + 1 : Math.max(0, count - 1);
            showToast(data.message, 'success');
          }
        } catch (e) {
          showToast('Failed to update follow state', 'error');
        } finally {
          btn.disabled = false;
        }
      }

      async function loadTargetPosts() {
        const stream = document.getElementById('targetPostsStream');
        try {
          const res = await fetch(`/api/posts/user/${targetUserId}`, { headers: authHeaders() });
          const posts = await res.json();
          document.getElementById('targetPostsCount').textContent = posts.length;

          if (!posts.length) {
            stream.innerHTML = '<div style="background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-lg);padding:40px;text-align:center;color:var(--text-muted);">No posts shared yet 🌸</div>';
            return;
          }

          stream.innerHTML = `
            <div class="posts-grid">
              ${posts
                .map((p) => {
                  return `
                    <article class="post-card">
                      <div class="post-header">
                        <div class="post-avatar">
                          ${p.user?.profilePicture ? `<img src="${p.user.profilePicture}">` : (p.user?.fullName?.[0]?.toUpperCase() || 'U')}
                        </div>
                        <div>
                          <div style="font-weight:700;">${p.user?.fullName || 'User'}</div>
                          <div style="font-size:12px;color:var(--text-subtle);">${timeAgo(p.createdAt)}</div>
                        </div>
                      </div>
                      ${p.content ? `<div class="post-content">${p.content}</div>` : ''}
                      ${p.image ? `<img class="post-image" src="${p.image}" alt="Post image"/>` : ''}
                      <div class="post-actions">
                        <span class="action-btn">
                          <svg class="ico ico-sm" style="color:var(--pink-500);fill:var(--pink-500);"><use href="#i-heart"/></svg>
                          <span>${p.likesCount || 0}</span>
                        </span>
                        <span class="action-btn">
                          <svg class="ico ico-sm"><use href="#i-comment"/></svg>
                          <span>${p.commentsCount || 0}</span>
                        </span>
                      </div>
                    </article>
                  `;
                })
                .join('')}
            </div>
          `;
        } catch (e) {
          stream.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:30px;">Could not load posts.</div>';
        }
      }

      loadTargetProfile();
    </script>
  </body>
</html>
