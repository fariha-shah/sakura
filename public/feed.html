<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Sakura — Home Feed</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,600&display=swap"
      rel="stylesheet"
    />
    <!-- Design System Stylesheet -->
    <link rel="stylesheet" href="/css/sakura-theme.css" />
    <style>
      /* ── Feed Specific Styles ── */
      .layout {
        max-width: 1180px;
        margin: 0 auto;
        padding: 80px 20px 80px;
        display: grid;
        grid-template-columns: 270px 1fr 290px;
        gap: 24px;
        align-items: start;
      }

      /* Left Sidebar */
      .sidebar-left {
        position: sticky;
        top: 80px;
      }

      .profile-card {
        background: var(--bg-card);
        border-radius: var(--radius-lg);
        padding: 24px 20px;
        text-align: center;
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--border-color);
        margin-bottom: 16px;
        transition: var(--transition);
      }

      .profile-card:hover {
        box-shadow: var(--shadow-md);
      }

      .profile-avatar-wrap {
        position: relative;
        width: 80px;
        height: 80px;
        margin: 0 auto 12px;
        cursor: pointer;
      }

      .profile-avatar {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: var(--pink-gradient);
        color: white;
        font-size: 28px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--sakura-glow);
        border: 3px solid var(--bg-card-subtle);
        overflow: hidden;
      }

      .profile-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .avatar-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      .profile-avatar-wrap:hover .avatar-overlay {
        opacity: 1;
      }

      .profile-name {
        font-size: 17px;
        font-weight: 700;
        color: var(--text-main);
      }

      .profile-username {
        font-size: 13px;
        color: var(--text-muted);
        margin-bottom: 6px;
      }

      .profile-bio {
        font-size: 13px;
        color: var(--text-muted);
        line-height: 1.4;
        margin-bottom: 16px;
        white-space: pre-line;
      }

      .profile-stats {
        display: flex;
        justify-content: space-around;
        padding-top: 14px;
        border-top: 1px solid var(--border-color);
      }

      .stat-item {
        cursor: pointer;
        transition: var(--transition);
      }

      .stat-item:hover {
        transform: translateY(-2px);
      }

      .stat-num {
        font-size: 16px;
        font-weight: 700;
        color: var(--pink-600);
      }

      [data-theme="dark"] .stat-num {
        color: var(--pink-400);
      }

      .stat-label {
        font-size: 11px;
        color: var(--text-subtle);
        text-transform: uppercase;
        font-weight: 600;
        letter-spacing: 0.05em;
      }

      /* Navigation Menu */
      .nav-menu {
        background: var(--bg-card);
        border-radius: var(--radius-lg);
        padding: 10px;
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--border-color);
      }

      .nav-menu-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border-radius: var(--radius-md);
        color: var(--text-main);
        text-decoration: none;
        font-size: 14.5px;
        font-weight: 600;
        transition: var(--transition);
        margin-bottom: 4px;
      }

      .nav-menu-item:last-child {
        margin-bottom: 0;
      }

      .nav-menu-item:hover {
        background: var(--bg-hover);
        color: var(--pink-600);
        transform: translateX(4px);
      }

      .nav-menu-item.active {
        background: var(--pink-gradient);
        color: white;
        box-shadow: var(--sakura-glow);
      }

      .nav-menu-item.active .ico {
        stroke: white;
      }

      /* Feed Center */
      .feed-center {
        min-width: 0;
      }

      /* Feed Tabs ("For You" vs "Following") */
      .feed-tabs {
        display: flex;
        gap: 8px;
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-full);
        padding: 5px;
        margin-bottom: 16px;
        box-shadow: var(--shadow-sm);
      }

      .feed-tab {
        flex: 1;
        padding: 10px 16px;
        border-radius: var(--radius-full);
        border: none;
        background: transparent;
        color: var(--text-muted);
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      .feed-tab.active {
        background: var(--pink-gradient);
        color: white;
        box-shadow: var(--sakura-glow);
      }

      /* Active Filter Banner */
      .filter-banner {
        display: none;
        align-items: center;
        justify-content: space-between;
        background: var(--bg-card);
        border: 1px solid var(--pink-400);
        border-radius: var(--radius-md);
        padding: 10px 16px;
        margin-bottom: 16px;
        font-size: 13.5px;
        color: var(--text-main);
      }

      .filter-banner.active {
        display: flex;
        animation: dropIn 0.3s ease both;
      }

      .filter-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-weight: 700;
        color: var(--pink-600);
      }

      [data-theme="dark"] .filter-badge {
        color: var(--pink-400);
      }

      .btn-clear-filter {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        font-weight: 600;
      }

      .btn-clear-filter:hover {
        color: var(--pink-600);
      }

      /* Create Post */
      .create-post {
        background: var(--bg-card);
        border-radius: var(--radius-lg);
        padding: 20px;
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow-sm);
        margin-bottom: 24px;
        transition: var(--transition);
      }

      .create-post:focus-within {
        border-color: var(--pink-400);
        box-shadow: var(--shadow-md);
      }

      .create-post-top {
        display: flex;
        gap: 12px;
      }

      .create-avatar {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--pink-gradient);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 16px;
        flex-shrink: 0;
        overflow: hidden;
      }

      .create-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .create-textarea {
        flex: 1;
        border: none;
        outline: none;
        background: transparent;
        font-family: inherit;
        font-size: 15px;
        color: var(--text-main);
        resize: none;
        min-height: 70px;
        line-height: 1.5;
      }

      .create-textarea::placeholder {
        color: var(--text-subtle);
      }

      /* Emoji bar */
      .emoji-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 10px 0 6px 56px;
        flex-wrap: wrap;
      }

      .emoji-pill {
        background: var(--bg-input);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-full);
        padding: 3px 10px;
        font-size: 13px;
        cursor: pointer;
        transition: var(--transition);
      }

      .emoji-pill:hover {
        background: var(--bg-hover);
        transform: scale(1.1);
      }

      .char-count {
        margin-left: auto;
        font-size: 12px;
        color: var(--text-subtle);
      }

      /* Preview wrap */
      .image-preview-wrap {
        display: none;
        margin: 12px 0 0 56px;
        position: relative;
        border-radius: var(--radius-md);
        overflow: hidden;
        border: 1px solid var(--border-color);
      }

      .image-preview {
        max-width: 100%;
        max-height: 320px;
        width: 100%;
        object-fit: cover;
        display: block;
      }

      .btn-remove-preview {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.65);
        color: white;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: var(--transition);
      }

      .btn-remove-preview:hover {
        background: rgba(220, 38, 38, 0.9);
      }

      .create-post-bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid var(--border-color);
      }

      .btn-attach {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        border-radius: var(--radius-full);
        background: var(--bg-input);
        color: var(--pink-600);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid var(--border-color);
        transition: var(--transition);
      }

      [data-theme="dark"] .btn-attach {
        color: var(--pink-300);
      }

      .btn-attach:hover {
        background: var(--pink-gradient);
        color: white;
        border-color: transparent;
      }

      .btn-post-submit {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 9px 22px;
        border-radius: var(--radius-full);
        background: var(--pink-gradient);
        color: white;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        border: none;
        cursor: pointer;
        box-shadow: var(--sakura-glow);
        transition: var(--transition);
      }

      .btn-post-submit:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 10px 26px rgba(244, 114, 182, 0.5);
      }

      .btn-post-submit:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      /* Post Card */
      .post-card {
        background: var(--bg-card);
        border-radius: var(--radius-lg);
        padding: 20px;
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow-sm);
        margin-bottom: 20px;
        transition: var(--transition);
        animation: dropIn 0.35s ease both;
      }

      .post-card:hover {
        box-shadow: var(--shadow-md);
      }

      .post-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }

      .post-avatar {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--pink-gradient);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
        overflow: hidden;
        flex-shrink: 0;
      }

      .post-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .post-user-info {
        flex: 1;
        min-width: 0;
      }

      .post-username-row {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }

      .post-name {
        font-size: 15px;
        font-weight: 700;
        color: var(--text-main);
        cursor: pointer;
        text-decoration: none;
      }

      .post-handle {
        font-size: 13px;
        color: var(--text-muted);
      }

      .post-time {
        font-size: 12px;
        color: var(--text-subtle);
        margin-top: 1px;
      }

      .post-content {
        font-size: 15px;
        line-height: 1.6;
        color: var(--text-main);
        margin-bottom: 12px;
        word-break: break-word;
        white-space: pre-line;
      }

      .post-content .hashtag-link {
        color: var(--pink-600);
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
      }

      [data-theme="dark"] .post-content .hashtag-link {
        color: var(--pink-400);
      }

      .post-content .hashtag-link:hover {
        text-decoration: underline;
      }

      .post-image {
        width: 100%;
        max-height: 480px;
        border-radius: var(--radius-md);
        object-fit: cover;
        cursor: pointer;
        margin-bottom: 14px;
        border: 1px solid var(--border-color);
        transition: transform 0.2s;
      }

      .post-image:hover {
        opacity: 0.97;
      }

      .post-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        padding-top: 10px;
        border-top: 1px solid var(--border-color);
      }

      .action-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 12px;
        border-radius: var(--radius-full);
        background: transparent;
        border: none;
        color: var(--text-muted);
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
      }

      .action-btn:hover {
        background: var(--bg-hover);
        color: var(--text-main);
      }

      .action-btn.liked {
        color: #ec4899;
      }

      .action-btn.liked svg {
        fill: #ec4899;
        stroke: #ec4899;
        transform: scale(1.15);
      }

      .action-btn.bookmarked {
        color: #f59e0b;
      }

      .action-btn.bookmarked svg {
        fill: #f59e0b;
        stroke: #f59e0b;
      }

      .post-menu-wrap {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 4px;
      }

      /* Comments Section */
      .comments-section {
        display: none;
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px dashed var(--border-color);
      }

      .comments-section.open {
        display: block;
        animation: dropIn 0.3s ease both;
      }

      .comment-item {
        display: flex;
        gap: 10px;
        margin-bottom: 12px;
      }

      .comment-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--pink-gradient);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
        flex-shrink: 0;
        overflow: hidden;
      }

      .comment-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .comment-bubble {
        background: var(--bg-input);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        padding: 8px 14px;
        flex: 1;
        position: relative;
      }

      .comment-user-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 2px;
      }

      .comment-user {
        font-size: 13px;
        font-weight: 700;
        color: var(--text-main);
      }

      .comment-time {
        font-size: 11px;
        color: var(--text-subtle);
      }

      .comment-text {
        font-size: 13.5px;
        color: var(--text-main);
        word-break: break-word;
      }

      .btn-del-comment {
        background: none;
        border: none;
        color: var(--text-subtle);
        cursor: pointer;
        padding: 2px 4px;
        border-radius: 4px;
      }

      .btn-del-comment:hover {
        color: #ef4444;
      }

      .add-comment {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }

      .comment-input {
        flex: 1;
        background: var(--bg-input);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-full);
        padding: 9px 16px;
        font-family: inherit;
        font-size: 13.5px;
        color: var(--text-main);
        outline: none;
        transition: var(--transition);
      }

      .comment-input:focus {
        border-color: var(--pink-400);
        background: var(--bg-card-subtle);
      }

      .btn-comment-send {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: var(--pink-gradient);
        color: white;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        transition: var(--transition);
      }

      .btn-comment-send:hover {
        transform: scale(1.06);
      }

      /* Right Sidebar */
      .sidebar-right {
        position: sticky;
        top: 80px;
      }

      .widget {
        background: var(--bg-card);
        border-radius: var(--radius-lg);
        padding: 20px;
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow-sm);
        margin-bottom: 20px;
      }

      .widget-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 15px;
        font-weight: 700;
        color: var(--text-main);
        margin-bottom: 14px;
      }

      .trend-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 10px;
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: var(--transition);
      }

      .trend-item:hover {
        background: var(--bg-hover);
      }

      .trend-tag {
        font-size: 14px;
        font-weight: 600;
        color: var(--pink-600);
      }

      [data-theme="dark"] .trend-tag {
        color: var(--pink-400);
      }

      .trend-count {
        font-size: 12px;
        color: var(--text-muted);
      }

      .suggest-user {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 8px;
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: var(--transition);
      }

      .suggest-user:hover {
        background: var(--bg-hover);
      }

      .suggest-avatar {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: var(--pink-gradient);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 14px;
        overflow: hidden;
        flex-shrink: 0;
      }

      .suggest-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .suggest-info {
        flex: 1;
        min-width: 0;
      }

      .suggest-name {
        font-size: 13.5px;
        font-weight: 700;
        color: var(--text-main);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .suggest-username {
        font-size: 12px;
        color: var(--text-muted);
      }

      .btn-follow-sm {
        padding: 5px 12px;
        border-radius: var(--radius-full);
        background: var(--pink-gradient);
        color: white;
        border: none;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
      }

      .btn-follow-sm:hover {
        transform: scale(1.05);
      }

      /* Modal styles */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        z-index: 500;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .modal-overlay.open {
        display: flex;
        animation: fadeIn 0.2s ease both;
      }

      .modal-box {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        width: 100%;
        max-width: 480px;
        max-height: 85vh;
        overflow-y: auto;
        box-shadow: var(--shadow-lg);
        animation: scaleUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .modal-header {
        padding: 16px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border-color);
      }

      .modal-title {
        font-size: 16px;
        font-weight: 700;
        color: var(--text-main);
      }

      .modal-close {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 4px;
      }

      .modal-body {
        padding: 20px;
      }

      /* Fullscreen Lightbox */
      .lightbox-modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.92);
        z-index: 600;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .lightbox-modal.open {
        display: flex;
      }

      .lightbox-modal img {
        max-width: 90vw;
        max-height: 90vh;
        border-radius: var(--radius-md);
        object-fit: contain;
      }

      .lightbox-close {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        color: white;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      /* Loading skeletons */
      .skeleton {
        background: linear-gradient(90deg, var(--bg-hover) 25%, var(--bg-input) 50%, var(--bg-hover) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
        border-radius: var(--radius-sm);
      }

      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }

      .loading-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid var(--border-color);
        border-top-color: var(--pink-600);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 20px auto;
      }

      @keyframes spin {

    <!-- ── Core JS Scripts ── -->
    <script src="/js/sakura-core.js"></script>
    <script>
      // ── Page State ──
      checkAuth(true);
      createPetals(6);

      let currentUser = getUser();
      let activeFeedFilter = 'forYou'; // 'forYou' | 'following'
      let activeTagFilter = '';
      let selectedPostImageBase64 = '';
      let editingPostId = null;

      // ── Initialize User Info ──
      function renderCurrentUserInfo(u = currentUser) {
        if (!u) return;
        const initials = u.fullName?.[0]?.toUpperCase() || 'U';

        // Nav Avatar
        const navAvatar = document.getElementById('navUserAvatar');
        if (navAvatar) {
          if (u.profilePicture) {
            navAvatar.innerHTML = `<img src="${u.profilePicture}" alt="${initials}">`;
          } else {
            navAvatar.textContent = initials;
          }
        }

        // Sidebar Avatar & Info
        const sideAvatar = document.getElementById('sideUserAvatar');
        if (sideAvatar) {
          if (u.profilePicture) {
            sideAvatar.innerHTML = `<img src="${u.profilePicture}" alt="${initials}">`;
          } else {
            sideAvatar.textContent = initials;
          }
        }
        document.getElementById('sideUserName').textContent = u.fullName || 'User';
        document.getElementById('sideUserHandle').textContent = '@' + (u.username || '');
        document.getElementById('sideUserBio').textContent = u.bio || '🌸 Living life in full blossom.';
        document.getElementById('sideStatFollowers').textContent = u.followersCount || 0;
        document.getElementById('sideStatFollowing').textContent = u.followingCount || 0;

        // Create post avatar
        const createAvatar = document.getElementById('createPostAvatar');
        if (createAvatar) {
          if (u.profilePicture) {
            createAvatar.innerHTML = `<img src="${u.profilePicture}" alt="${initials}">`;
          } else {
            createAvatar.textContent = initials;
          }
        }
      }

      async function syncCurrentUser() {
        try {
          const res = await fetch('/api/auth/me', { headers: authHeaders() });
          if (res.ok) {
            currentUser = await res.json();
            setUser(currentUser);
            renderCurrentUserInfo(currentUser);
          }
        } catch (e) {}
      }

      // ── Post Input & Char Count ──
      function handlePostInput(el) {
        const len = el.value.length;
        document.getElementById('postCharCount').textContent = `${len}/1000`;
      }

      function insertEmoji(emoji) {
        const input = document.getElementById('postTextInput');
        input.value += (input.value ? ' ' : '') + emoji;
        input.focus();
        handlePostInput(input);
      }

      async function handleImageSelection(input) {
        const file = input.files[0];
        if (!file) return;

        try {
          // Compress high-res phone camera images before uploading!
          const compressed = await compressImage(file, 1280, 0.82);
          selectedPostImageBase64 = compressed;
          document.getElementById('imagePreviewImg').src = compressed;
          document.getElementById('imagePreviewWrap').style.display = 'block';
        } catch (err) {
          showToast('Failed to process image. Please try another.', 'error');
        }
      }

      function removeSelectedImage() {
        selectedPostImageBase64 = '';
        document.getElementById('imagePreviewImg').src = '';
        document.getElementById('imagePreviewWrap').style.display = 'none';
        document.getElementById('postFileInput').value = '';
      }

      function focusCreatePost() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        const input = document.getElementById('postTextInput');
        if (input) input.focus();
      }

      // ── Create Post ──
      async function submitNewPost() {
        const content = document.getElementById('postTextInput').value.trim();
        if (!content && !selectedPostImageBase64) {
          showToast('Please write a message or add a photo 🌸', 'info');
          return;
        }

        const btn = document.getElementById('btnSubmitPost');
        btn.disabled = true;
        btn.innerHTML = `<div class="loading-spinner" style="width:16px;height:16px;border-width:2px;margin:0 4px"></div> Posting...`;

        try {
          const res = await fetch('/api/posts', {
            method: 'POST',
            headers: authHeaders(),
            body: JSON.stringify({
              content,
              image: selectedPostImageBase64,
            }),
          });

          const data = await res.json();
          if (res.ok) {
            document.getElementById('postTextInput').value = '';
            handlePostInput(document.getElementById('postTextInput'));
            removeSelectedImage();
            showToast('Moment shared successfully! ✨', 'success');
            loadPosts();
            loadTrendingTags();
          } else {
            showToast(data.message || 'Could not create post', 'error');
          }
        } catch (err) {
          showToast('Network error while posting. Please retry.', 'error');
        } finally {
          btn.disabled = false;
          btn.innerHTML = `<svg class="ico ico-sm"><use href="#i-send" /></svg><span>Share Post</span>`;
        }
      }

      // ── Feed Tabs & Filters ──
      function switchFeedTab(tab) {
        activeFeedFilter = tab;
        document.getElementById('tabForYou').classList.toggle('active', tab === 'forYou');
        document.getElementById('tabFollowing').classList.toggle('active', tab === 'following');
        loadPosts();
      }

      function filterByHashtag(tag) {
        activeTagFilter = tag.replace(/^#/, '');
        const banner = document.getElementById('filterBanner');
        document.getElementById('filterBannerText').textContent = `Showing posts tagged with #${activeTagFilter}`;
        banner.classList.add('active');
        loadPosts();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function clearFeedFilter() {
        activeTagFilter = '';
        document.getElementById('filterBanner').classList.remove('active');
        loadPosts();
      }

      // ── Load Posts Stream ──
      async function loadPosts() {
        const container = document.getElementById('postsStream');
        container.innerHTML = '<div class="loading-spinner"></div>';

        let url = `/api/posts?feed=${activeFeedFilter}&limit=20`;
        if (activeTagFilter) {
          url += `&tag=${encodeURIComponent(activeTagFilter)}`;
        }

        try {
          const res = await fetch(url, { headers: authHeaders() });
          if (!res.ok) throw new Error('Failed to load posts');
          const data = await res.json();
          renderPostsList(data.posts || []);
        } catch (err) {
          container.innerHTML = `
            <div style="background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-lg);padding:36px 20px;text-align:center;">
              <svg class="ico" style="width:40px;height:40px;color:var(--pink-400);margin-bottom:12px;"><use href="#i-inbox"/></svg>
              <div style="font-weight:700;font-size:16px;">Could not load posts</div>
              <div style="color:var(--text-muted);font-size:13px;margin:6px 0 16px;">Make sure your backend server is active.</div>
              <button class="btn-post-submit" onclick="loadPosts()">Retry</button>
            </div>
          `;
        }
      }

      function renderPostsList(posts) {
        const container = document.getElementById('postsStream');
        if (!posts.length) {
          container.innerHTML = `
            <div style="background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-lg);padding:40px 20px;text-align:center;">
              <svg class="ico" style="width:44px;height:44px;color:var(--pink-300);margin-bottom:12px;"><use href="#i-inbox"/></svg>
              <div style="font-weight:700;font-size:16px;color:var(--text-main);">No posts found</div>
              <div style="color:var(--text-muted);font-size:13.5px;margin-top:4px;">
                ${activeFeedFilter === 'following' ? 'Follow more creators to see their moments here 🌸' : 'Be the first to share something beautiful!'}
              </div>
            </div>
          `;
          return;
        }

        const myId = currentUser._id;
        const myBookmarks = Array.isArray(currentUser.bookmarks)
          ? currentUser.bookmarks.map((b) => (typeof b === 'object' ? b._id : b))
          : [];

        container.innerHTML = posts
          .map((post) => {
            const author = post.user || {};
            const initials = author.fullName?.[0]?.toUpperCase() || 'U';
            const avatarHtml = author.profilePicture
              ? `<img src="${author.profilePicture}" alt="${initials}">`
              : initials;

            const isLiked = post.likes && post.likes.includes(myId);
            const isBookmarked = myBookmarks.includes(post._id);
            const isOwner = author._id === myId;

            // Format hashtags as clickable links
            const formattedContent = (post.content || '').replace(
              /#[a-zA-Z0-9_\u0600-\u06FF]+/g,
              (tag) => `<a class="hashtag-link" onclick="event.preventDefault();filterByHashtag('${tag}')">${tag}</a>`
            );

            return `
              <article class="post-card" id="post-${post._id}">
                <div class="post-header">
                  <div class="post-avatar" onclick="navigateToUser('${author._id}')">
                    ${avatarHtml}
                  </div>
                  <div class="post-user-info">
                    <div class="post-username-row">
                      <a class="post-name" onclick="navigateToUser('${author._id}')">${author.fullName || 'Sakura Blossom'}</a>
                      <span class="post-handle">@${author.username || ''}</span>
                    </div>
                    <div class="post-time">${timeAgo(post.createdAt)}</div>
                  </div>

                  ${
                    isOwner
                      ? `
                    <div class="post-menu-wrap">
                      <button class="action-btn" onclick="openEditPostModal('${post._id}', ${JSON.stringify(post.content || '').replace(/"/g, '&quot;')})" title="Edit post">
                        <svg class="ico ico-sm"><use href="#i-edit"/></svg>
                      </button>
                      <button class="action-btn" onclick="confirmDeletePost('${post._id}')" title="Delete post">
                        <svg class="ico ico-sm" style="color:#ef4444"><use href="#i-trash"/></svg>
                      </button>
                    </div>`
                      : ''
                  }
                </div>

                ${post.content ? `<div class="post-content">${formattedContent}</div>` : ''}
                ${post.image ? `<img class="post-image" src="${post.image}" alt="Post attachment" onclick="openLightbox('${post.image}')" loading="lazy"/>` : ''}

                <div class="post-actions">
                  <button class="action-btn ${isLiked ? 'liked' : ''}" id="like-btn-${post._id}" onclick="toggleLikePost('${post._id}')">
                    <svg class="ico ico-sm"><use href="#i-heart"/></svg>
                    <span id="like-count-${post._id}">${post.likesCount || 0}</span>
                  </button>

                  <button class="action-btn" onclick="toggleCommentsSection('${post._id}')">
                    <svg class="ico ico-sm"><use href="#i-comment"/></svg>
                    <span id="comment-count-${post._id}">${post.commentsCount || 0}</span>
                  </button>

                  <button class="action-btn ${isBookmarked ? 'bookmarked' : ''}" id="bookmark-btn-${post._id}" onclick="toggleBookmarkPost('${post._id}')" title="Save post">
                    <svg class="ico ico-sm"><use href="#i-bookmark"/></svg>
                  </button>

                  <button class="action-btn" onclick="sharePost('${post._id}')" title="Share link">
                    <svg class="ico ico-sm"><use href="#i-share"/></svg>
                  </button>
                </div>

                <!-- Comments Dropdown -->
                <div class="comments-section" id="comments-${post._id}">
                  <div id="comments-list-${post._id}">
                    <div class="loading-spinner" style="width:20px;height:20px;border-width:2px;"></div>
                  </div>

                  <div class="add-comment">
                    <input
                      type="text"
                      class="comment-input"
                      id="comment-input-${post._id}"
                      placeholder="Write a sweet comment..."
                      onkeydown="if(event.key==='Enter')submitComment('${post._id}')"
                    />
                    <button class="btn-comment-send" onclick="submitComment('${post._id}')" title="Send comment">
                      <svg class="ico ico-xs" style="stroke:white"><use href="#i-send"/></svg>
                    </button>
                  </div>
                </div>
              </article>
            `;
          })
          .join('');
      }

      function navigateToUser(userId) {
        if (!userId) return;
        if (userId === currentUser._id) {
          window.location.href = 'profile.html';
        } else {
          window.location.href = `user-profile.html?id=${userId}`;
        }
      }

      // ── Like / Bookmark / Share Actions ──
      async function toggleLikePost(postId) {
        const btn = document.getElementById(`like-btn-${postId}`);
        const countEl = document.getElementById(`like-count-${postId}`);
        const isLiked = btn.classList.contains('liked');

        // Optimistic UI update
        btn.classList.toggle('liked');
        let count = parseInt(countEl.textContent) || 0;
        countEl.textContent = isLiked ? Math.max(0, count - 1) : count + 1;

        try {
          const res = await fetch(`/api/posts/${postId}/like`, {
            method: isLiked ? 'DELETE' : 'POST',
            headers: authHeaders(),
          });
          const data = await res.json();
          if (res.ok) {
            countEl.textContent = data.likesCount;
          } else {
            // Revert
            btn.classList.toggle('liked');
            countEl.textContent = count;
          }
        } catch (e) {
          btn.classList.toggle('liked');
          countEl.textContent = count;
        }
      }

      async function toggleBookmarkPost(postId) {
        const btn = document.getElementById(`bookmark-btn-${postId}`);
        btn.classList.toggle('bookmarked');

        try {
          const res = await fetch(`/api/posts/${postId}/bookmark`, {
            method: 'POST',
            headers: authHeaders(),
          });
          const data = await res.json();
          if (res.ok) {
            currentUser.bookmarks = data.bookmarks;
            setUser(currentUser);
            showToast(data.message, 'success');
          } else {
            btn.classList.toggle('bookmarked');
          }
        } catch (e) {
          btn.classList.toggle('bookmarked');
        }
      }

      function sharePost(postId) {
        const url = `${window.location.origin}/feed.html#post-${postId}`;
        if (navigator.share) {
          navigator.share({
            title: 'Sakura Post',
            text: 'Check out this post on Sakura Social!',
            url,
          }).catch(() => {});
        } else if (navigator.clipboard) {
          navigator.clipboard.writeText(url).then(() => {
            showToast('Post link copied to clipboard! 📋', 'success');
          });
        } else {
          showToast(`Link: ${url}`, 'info');
        }
      }

      // ── Comments ──
      function toggleCommentsSection(postId) {
        const sec = document.getElementById(`comments-${postId}`);
        sec.classList.toggle('open');
        if (sec.classList.contains('open')) {
          loadComments(postId);
        }
      }

      async function loadComments(postId) {
        const listEl = document.getElementById(`comments-list-${postId}`);
        try {
          const res = await fetch(`/api/posts/${postId}/comments`, { headers: authHeaders() });
          const comments = await res.json();

          if (!comments.length) {
            listEl.innerHTML = '<div style="color:var(--text-muted);font-size:13px;padding:6px 0;">No comments yet. Say something friendly! 🌸</div>';
            return;
          }

          listEl.innerHTML = comments
            .map((c) => {
              const u = c.user || {};
              const initials = u.fullName?.[0]?.toUpperCase() || 'U';
              const avatar = u.profilePicture ? `<img src="${u.profilePicture}" alt="${initials}">` : initials;
              const isCommentAuthor = u._id === currentUser._id;

              return `
                <div class="comment-item" id="comment-${c._id}">
                  <div class="comment-avatar" onclick="navigateToUser('${u._id}')">${avatar}</div>
                  <div class="comment-bubble">
                    <div class="comment-user-row">
                      <span class="comment-user" onclick="navigateToUser('${u._id}')">${u.fullName || 'User'}</span>
                      <div>
                        <span class="comment-time">${timeAgo(c.createdAt)}</span>
                        ${
                          isCommentAuthor
                            ? `<button class="btn-del-comment" onclick="deleteComment('${postId}', '${c._id}')" title="Delete comment"><svg class="ico ico-xs"><use href="#i-trash"/></svg></button>`
                            : ''
                        }
                      </div>
                    </div>
                    <div class="comment-text">${c.content}</div>
                  </div>
                </div>
              `;
            })
            .join('');
        } catch (e) {
          listEl.innerHTML = '<div style="color:var(--text-muted);font-size:13px;">Failed to load comments.</div>';
        }
      }

      async function submitComment(postId) {
        const input = document.getElementById(`comment-input-${postId}`);
        const content = input.value.trim();
        if (!content) return;

        try {
          const res = await fetch(`/api/posts/${postId}/comments`, {
            method: 'POST',
            headers: authHeaders(),
            body: JSON.stringify({ content }),
          });

          if (res.ok) {
            input.value = '';
            loadComments(postId);
            const countEl = document.getElementById(`comment-count-${postId}`);
            countEl.textContent = (parseInt(countEl.textContent) || 0) + 1;
          } else {
            showToast('Could not post comment', 'error');
          }
        } catch (e) {
          showToast('Network error', 'error');
        }
      }

      async function deleteComment(postId, commentId) {
        if (!confirm('Delete this comment?')) return;
        try {
          const res = await fetch(`/api/posts/${postId}/comments/${commentId}`, {
            method: 'DELETE',
            headers: authHeaders(),
          });
          if (res.ok) {
            loadComments(postId);
            const countEl = document.getElementById(`comment-count-${postId}`);
            countEl.textContent = Math.max(0, (parseInt(countEl.textContent) || 0) - 1);
            showToast('Comment deleted', 'info');
          }
        } catch (e) {}
      }

      // ── Post Edit & Delete ──
      function openEditPostModal(postId, content) {
        editingPostId = postId;
        document.getElementById('editPostText').value = content;
        document.getElementById('editPostModal').classList.add('open');
      }

      function closeEditPostModal() {
        document.getElementById('editPostModal').classList.remove('open');
        editingPostId = null;
      }

      async function saveEditedPost() {
        if (!editingPostId) return;
        const content = document.getElementById('editPostText').value.trim();
        const btn = document.getElementById('btnSaveEditedPost');
        btn.disabled = true;

        try {
          const res = await fetch(`/api/posts/${editingPostId}`, {
            method: 'PUT',
            headers: authHeaders(),
            body: JSON.stringify({ content }),
          });

          if (res.ok) {
            showToast('Post updated successfully!', 'success');
            closeEditPostModal();
            loadPosts();
          } else {
            const data = await res.json();
            showToast(data.message || 'Failed to update post', 'error');
          }
        } catch (e) {
          showToast('Network error', 'error');
        } finally {
          btn.disabled = false;
        }
      }

      async function confirmDeletePost(postId) {
        if (!confirm('Are you sure you want to delete this post?')) return;
        try {
          const res = await fetch(`/api/posts/${postId}`, {
            method: 'DELETE',
            headers: authHeaders(),
          });
          if (res.ok) {
            showToast('Post deleted', 'info');
            const el = document.getElementById(`post-${postId}`);
            if (el) el.remove();
            loadTrendingTags();
          }
        } catch (e) {
          showToast('Failed to delete post', 'error');
        }
      }

      // ── Trending Tags ──
      async function loadTrendingTags() {
        const listEl = document.getElementById('trendingList');
        try {
          const res = await fetch('/api/posts/trending', { headers: authHeaders() });
          const tags = await res.json();

          if (!tags.length) {
            listEl.innerHTML = '<div style="color:var(--text-muted);font-size:13px;padding:8px 0;">No trending tags yet.<br><span style="font-size:12px;">Use #tags in your posts!</span></div>';
            return;
          }

          listEl.innerHTML = tags
            .map(
              (t) => `
                <div class="trend-item" onclick="filterByHashtag('${t.tag}')">
                  <span class="trend-tag">${t.tag}</span>
                  <span class="trend-count">${t.count} ${t.count === 1 ? 'post' : 'posts'}</span>
                </div>
              `
            )
            .join('');
        } catch (e) {
          listEl.innerHTML = '<div style="color:var(--text-muted);font-size:12px;">Failed to load tags.</div>';
        }
      }

      // ── Who to Follow ──
      async function loadSuggestions() {
        const listEl = document.getElementById('suggestionsList');
        try {
          const res = await fetch('/api/users/suggestions', { headers: authHeaders() });
          const users = await res.json();

          if (!users.length) {
            listEl.innerHTML = '<div style="color:var(--text-muted);font-size:13px;padding:8px 0;">You follow everyone! 🌸</div>';
            return;
          }

          listEl.innerHTML = users
            .slice(0, 5)
            .map((u) => {
              const initials = u.fullName?.[0]?.toUpperCase() || 'U';
              const avatar = u.profilePicture ? `<img src="${u.profilePicture}" alt="${initials}">` : initials;
              return `
                <div class="suggest-user" id="suggest-${u._id}" onclick="navigateToUser('${u._id}')">
                  <div class="suggest-avatar">${avatar}</div>
                  <div class="suggest-info">
                    <div class="suggest-name">${u.fullName}</div>
                    <div class="suggest-username">@${u.username}</div>
                  </div>
                  <button class="btn-follow-sm" onclick="event.stopPropagation();quickFollow('${u._id}', this)">Follow</button>
                </div>
              `;
            })
            .join('');
        } catch (e) {
          listEl.innerHTML = '<div style="color:var(--text-muted);font-size:12px;">Suggestions unavailable.</div>';
        }
      }

      async function quickFollow(userId, btn) {
        btn.disabled = true;
        try {
          const res = await fetch(`/api/users/${userId}/follow`, {
            method: 'POST',
            headers: authHeaders(),
          });
          if (res.ok) {
            btn.textContent = '✓ Following';
            btn.style.background = '#10b981';
            showToast('Followed successfully!', 'success');
            syncCurrentUser();
            setTimeout(() => {
              const item = document.getElementById(`suggest-${userId}`);
              if (item) item.remove();
            }, 600);
          }
        } catch (e) {
          btn.disabled = false;
        }
      }

      // ── Follow List Modal (Followers / Following) ──
      async function openFollowListModal(type) {
        const modal = document.getElementById('followListModal');
        const title = document.getElementById('followListTitle');
        const body = document.getElementById('followListBody');

        title.textContent = type === 'followers' ? 'My Followers' : 'People I Follow';
        body.innerHTML = '<div class="loading-spinner"></div>';
        modal.classList.add('open');

        try {
          const res = await fetch(`/api/users/${currentUser._id}/${type}`, { headers: authHeaders() });
          const list = await res.json();

          if (!list.length) {
            body.innerHTML = `<div style="text-align:center;padding:24px;color:var(--text-muted);font-size:14px;">No ${type} yet.</div>`;
            return;
          }

          body.innerHTML = list
            .map((u) => {
              const initials = u.fullName?.[0]?.toUpperCase() || 'U';
              const avatar = u.profilePicture ? `<img src="${u.profilePicture}" alt="${initials}">` : initials;
              return `
                <div class="suggest-user" onclick="closeFollowListModal();navigateToUser('${u._id}')">
                  <div class="suggest-avatar">${avatar}</div>
                  <div class="suggest-info">
                    <div class="suggest-name">${u.fullName}</div>
                    <div class="suggest-username">@${u.username}</div>
                  </div>
                </div>
              `;
            })
            .join('');
        } catch (e) {
          body.innerHTML = '<div style="color:var(--text-muted);text-align:center;">Could not load list.</div>';
        }
      }

      function closeFollowListModal() {
        document.getElementById('followListModal').classList.remove('open');
      }

      // ── Fullscreen Lightbox ──
      function openLightbox(src) {
        document.getElementById('lightboxImg').src = src;
        document.getElementById('lightboxModal').classList.add('open');
      }

      function closeLightbox() {
        document.getElementById('lightboxModal').classList.remove('open');
      }

      // ── Global Search with Debounce ──
      let searchTimer = null;
      const searchInput = document.getElementById('globalSearchInput');
      const searchDropdown = document.getElementById('searchDropdown');
      const searchResultsList = document.getElementById('searchResultsList');

      searchInput.addEventListener('input', function () {
        const q = this.value.trim();
        clearTimeout(searchTimer);

        if (!q) {
          searchDropdown.classList.remove('open');
          return;
        }

        // If typing #hashtag, filter right away
        if (q.startsWith('#')) {
          searchDropdown.classList.remove('open');
          filterByHashtag(q);
          return;
        }

        searchDropdown.classList.add('open');
        searchResultsList.innerHTML = '<div style="padding:14px;text-align:center;"><div class="loading-spinner" style="width:18px;height:18px;border-width:2px;margin:0 auto"></div></div>';

        searchTimer = setTimeout(async () => {
          try {
            const res = await fetch(`/api/users/search?search=${encodeURIComponent(q)}`, {
              headers: authHeaders(),
            });
            const users = await res.json();

            if (!users || !users.length) {
              searchResultsList.innerHTML = `<div class="search-empty">No users found for "<b>${q}</b>"</div>`;
              return;
            }

            searchResultsList.innerHTML = users
              .map((u) => {
                const initials = u.fullName?.[0]?.toUpperCase() || 'U';
                const avatar = u.profilePicture ? `<img src="${u.profilePicture}" alt="${initials}">` : initials;
                return `
                  <div class="search-result-item" onclick="navigateToUser('${u._id}')">
                    <div class="search-result-avatar">${avatar}</div>
                    <div class="search-result-info">
                      <div class="search-result-name">${u.fullName}</div>
                      <div class="search-result-username">@${u.username}</div>
                    </div>
                  </div>
                `;
              })
              .join('');
          } catch (e) {
            searchResultsList.innerHTML = '<div class="search-empty">Search error</div>';
          }
        }, 300);
      });

      // ── Initial Boot ──
      renderCurrentUserInfo(currentUser);
      syncCurrentUser();
      loadPosts();
      loadTrendingTags();
      loadSuggestions();
      fetchNotifications();

      // Poll notifications every 35 seconds
      setInterval(fetchNotifications, 35000);
    </script>
  </body>
</html>
