<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Sakura — Create Account</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/sakura-theme.css" />
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        position: relative;
        overflow-x: hidden;
      }

      .blob {
        position: fixed;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.35;
        pointer-events: none;
        z-index: 0;
        animation: blobFloat 12s ease-in-out infinite alternate;
      }

      .blob-1 {
        width: 450px;
        height: 450px;
        background: #f472b6;
        top: -100px;
        right: -100px;
      }

      .blob-2 {
        width: 400px;
        height: 400px;
        background: #db2777;
        bottom: -80px;
        left: -80px;
        animation-delay: -5s;
      }

      @keyframes blobFloat {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(30px, -30px) scale(1.08); }
      }

      .auth-card {
        width: 100%;
        max-width: 920px;
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
        display: grid;
        grid-template-columns: 1fr 1.25fr;
        overflow: hidden;
        position: relative;
        z-index: 10;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        animation: scaleUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      @keyframes scaleUp {
        from { opacity: 0; transform: scale(0.96) translateY(12px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }

      .auth-art-panel {
        background: linear-gradient(135deg, rgba(252, 231, 243, 0.7) 0%, rgba(244, 114, 182, 0.4) 100%);
        border-right: 1px solid var(--border-color);
        padding: 48px 36px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        overflow: hidden;
      }

      [data-theme="dark"] .auth-art-panel {
        background: linear-gradient(135deg, rgba(30, 27, 46, 0.8) 0%, rgba(55, 32, 69, 0.6) 100%);
      }

      .art-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: 'Playfair Display', serif;
        font-size: 26px;
        font-weight: 700;
        color: var(--pink-600);
      }

      [data-theme="dark"] .art-brand {
        color: var(--pink-300);
      }

      .art-illustration {
        margin: 32px 0;
        text-align: center;
      }

      .art-circle {
        width: 130px;
        height: 130px;
        border-radius: 50%;
        background: var(--pink-gradient);
        box-shadow: var(--sakura-glow);
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 54px;
        animation: pulse 3s infinite ease-in-out;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); box-shadow: var(--sakura-glow); }
        50% { transform: scale(1.05); box-shadow: 0 12px 36px rgba(244, 114, 182, 0.6); }
      }

      .art-title {
        font-family: 'Playfair Display', serif;
        font-size: 22px;
        font-weight: 700;
        color: var(--text-main);
        margin-bottom: 8px;
      }

      .art-desc {
        font-size: 14px;
        color: var(--text-muted);
        line-height: 1.5;
      }

      .art-quote {
        font-size: 12.5px;
        color: var(--text-subtle);
        font-style: italic;
      }

      .auth-form-panel {
        padding: 44px 38px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .form-header {
        margin-bottom: 24px;
      }

      .form-heading {
        font-family: 'Playfair Display', serif;
        font-size: 28px;
        font-weight: 700;
        color: var(--text-main);
        margin-bottom: 6px;
      }

      .form-subheading {
        font-size: 14px;
        color: var(--text-muted);
      }

      .form-subheading a {
        color: var(--pink-600);
        font-weight: 600;
        text-decoration: none;
      }

      [data-theme="dark"] .form-subheading a {
        color: var(--pink-400);
      }

      .form-row-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .input-field-group {
        margin-bottom: 16px;
      }

      .input-label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-main);
        margin-bottom: 6px;
      }

      .input-wrap {
        position: relative;
        display: flex;
        align-items: center;
      }

      .input-icon {
        position: absolute;
        left: 14px;
        color: var(--text-subtle);
        display: flex;
        align-items: center;
        pointer-events: none;
      }

      .auth-input {
        width: 100%;
        background: var(--bg-input);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        padding: 11px 14px 11px 42px;
        font-family: inherit;
        font-size: 14.5px;
        color: var(--text-main);
        outline: none;
        transition: var(--transition);
      }

      .auth-input:focus {
        border-color: var(--pink-500);
        box-shadow: 0 0 0 3px rgba(244, 114, 182, 0.2);
        background: var(--bg-card-subtle);
      }

      .btn-toggle-pwd {
        position: absolute;
        right: 12px;
        background: none;
        border: none;
        color: var(--text-subtle);
        cursor: pointer;
        padding: 4px;
      }

      .btn-auth-submit {
        width: 100%;
        padding: 13px;
        border-radius: var(--radius-md);
        background: var(--pink-gradient);
        color: white;
        font-family: inherit;
        font-size: 15px;
        font-weight: 700;
        border: none;
        cursor: pointer;
        box-shadow: var(--sakura-glow);
        transition: var(--transition);
        margin-top: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .btn-auth-submit:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 12px 32px rgba(244, 114, 182, 0.5);
      }

      .btn-auth-submit:disabled {
        opacity: 0.65;
        cursor: not-allowed;
      }

      .auth-footer {
        text-align: center;
        margin-top: 20px;
        font-size: 13.5px;
        color: var(--text-muted);
      }

      .auth-footer a {
        color: var(--pink-600);
        font-weight: 600;
        text-decoration: none;
      }

      [data-theme="dark"] .auth-footer a {
        color: var(--pink-400);
      }

      .top-theme-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 100;
      }

      @media (max-width: 768px) {
        .auth-card {
          grid-template-columns: 1fr;
          max-width: 440px;
        }
        .auth-art-panel {
          padding: 28px 24px 20px;
          text-align: center;
          align-items: center;
          border-right: none;
          border-bottom: 1px solid var(--border-color);
        }
        .art-illustration {
          display: none;
        }
        .art-quote {
          display: none;
        }
        .auth-form-panel {
          padding: 30px 22px;
        }
        .form-row-2 {
          grid-template-columns: 1fr;
          gap: 0;
        }
        .form-heading {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Background Blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <!-- Theme Toggle Floating -->
    <div class="top-theme-btn">
      <button class="nav-icon-btn" onclick="toggleTheme()" title="Toggle Theme">
        <svg class="ico"><use class="theme-icon-use" href="#i-moon" /></svg>
      </button>
    </div>

    <!-- Hidden Icons -->
    <svg style="display: none" xmlns="http://www.w3.org/2000/svg">
      <symbol id="i-aperture" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="14.31" y1="8" x2="20.05" y2="17.94"/><line x1="9.69" y1="8" x2="21.17" y2="8"/><line x1="7.38" y1="12" x2="13.12" y2="2.06"/><line x1="9.69" y1="16" x2="3.95" y2="6.06"/><line x1="14.31" y1="16" x2="2.83" y2="16"/><line x1="16.62" y1="12" x2="10.88" y2="21.94"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
      <symbol id="i-mail" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></symbol>
    </svg>

    <div class="auth-card">
      <!-- Left Panel -->
      <div class="auth-art-panel">
        <div class="art-brand">
          <div class="nav-brand-icon" style="width: 34px; height: 34px;">
            <svg class="ico"><use href="#i-aperture" /></svg>
          </div>
          Sakura
        </div>

        <div class="art-illustration">
          <div class="art-circle">🌸</div>
          <div class="art-title">Join Sakura</div>
          <p class="art-desc">Create your profile, share your thoughts, and connect with inspiring creators worldwide.</p>
        </div>

        <div class="art-quote">
          "Every great journey begins with a single blossom."
        </div>
      </div>

      <!-- Right Panel (Form) -->
      <div class="auth-form-panel">
        <div class="form-header">
          <h2 class="form-heading">Create Account</h2>
          <p class="form-subheading">
            Already have an account? <a href="login.html">Sign in</a>
          </p>
        </div>

        <form id="registerForm" onsubmit="event.preventDefault();handleRegister();">
          <div class="form-row-2">
            <div class="input-field-group">
              <label class="input-label" for="regFullName">Full Name</label>
              <div class="input-wrap">
                <span class="input-icon"><svg class="ico ico-sm"><use href="#i-user"/></svg></span>
                <input
                  type="text"
                  class="auth-input"
                  id="regFullName"
                  placeholder="Your Name"
                  required
                />
              </div>
            </div>

            <div class="input-field-group">
              <label class="input-label" for="regUsername">Username</label>
              <div class="input-wrap">
                <span class="input-icon" style="font-weight: 700; font-size: 14px;">@</span>
                <input
                  type="text"
                  class="auth-input"
                  id="regUsername"
                  placeholder="username"
                  required
                />
              </div>
            </div>
          </div>

          <div class="input-field-group">
            <label class="input-label" for="regEmail">Email Address</label>
            <div class="input-wrap">
              <span class="input-icon"><svg class="ico ico-sm"><use href="#i-mail"/></svg></span>
              <input
                type="email"
                class="auth-input"
                id="regEmail"
                placeholder="you@example.com"
                required
                autocomplete="email"
              />
            </div>
          </div>

          <div class="input-field-group">
            <label class="input-label" for="regPassword">Password</label>
            <div class="input-wrap">
              <span class="input-icon"><svg class="ico ico-sm"><use href="#i-lock"/></svg></span>
              <input
                type="password"
                class="auth-input"
                id="regPassword"
                placeholder="At least 6 characters"
                minlength="6"
                required
                autocomplete="new-password"
              />
              <button type="button" class="btn-toggle-pwd" onclick="togglePasswordVisibility('regPassword')" title="Show/hide password">
                <svg class="ico ico-sm"><use href="#i-eye"/></svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-auth-submit" id="btnRegisterSubmit">
            <span>Create My Account</span>
          </button>
        </form>

        <div class="auth-footer">
          Already a member? <a href="login.html">Sign in here</a>
        </div>
      </div>
    </div>

    <script src="/js/sakura-core.js"></script>
    <script>
      createPetals(6);

      if (getToken()) {
        window.location.href = 'feed.html';
      }

      function togglePasswordVisibility(fieldId) {
        const input = document.getElementById(fieldId);
        input.type = input.type === 'password' ? 'text' : 'password';
      }

      async function handleRegister() {
        const fullName = document.getElementById('regFullName').value.trim();
        const username = document.getElementById('regUsername').value.trim().toLowerCase();
        const email = document.getElementById('regEmail').value.trim().toLowerCase();
        const password = document.getElementById('regPassword').value;

        if (!fullName || !username || !email || !password) {
          showToast('Please fill out all fields', 'error');
          return;
        }

        if (password.length < 6) {
          showToast('Password must be at least 6 characters', 'error');
          return;
        }

        const btn = document.getElementById('btnRegisterSubmit');
        btn.disabled = true;
        btn.innerHTML = `<div class="loading-spinner" style="width:16px;height:16px;border-width:2px;margin:0 4px"></div> Creating account...`;

        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fullName, username, email, password }),
          });

          const data = await res.json();

          if (res.ok) {
            localStorage.setItem('token', data.token);
            setUser(data);
            showToast('Account created! Welcome to Sakura 🌸', 'success');
            setTimeout(() => {
              window.location.href = 'feed.html';
            }, 900);
          } else {
            showToast(data.message || 'Registration failed', 'error');
          }
        } catch (e) {
          showToast('Server connection failed. Is the backend running?', 'error');
        } finally {
          btn.disabled = false;
          btn.innerHTML = `<span>Create My Account</span>`;
        }
      }
    </script>
  </body>
</html>
