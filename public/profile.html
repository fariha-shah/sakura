<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Sakura — My Profile</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/sakura-theme.css" />
    <style>
      .profile-container {
        max-width: 960px;
        margin: 0 auto;
        padding: 80px 20px 80px;
      }

      /* Hero Section */
      .profile-hero-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        overflow: hidden;
        box-shadow: var(--shadow-sm);
        margin-bottom: 24px;
        position: relative;
      }

      /* Cover Photo */
      .cover-area {
        height: 240px;
        background: linear-gradient(135deg, #fbcfe8 0%, #f472b6 50%, #db2777 100%);
        position: relative;
        overflow: hidden;
      }

      [data-theme="dark"] .cover-area {
        background: linear-gradient(135deg, #1e1b2e 0%, #372045 50%, #581c3f 100%);
      }

      .cover-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        inset: 0;
      }

      .cover-actions {
        position: absolute;
        bottom: 14px;
        right: 14px;
        display: flex;
        gap: 8px;
        z-index: 5;
      }

      .cover-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 14px;
        border-radius: var(--radius-full);
        background: rgba(0, 0, 0, 0.65);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(8px);
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
      }

      .cover-btn:hover {
        background: rgba(0, 0, 0, 0.85);
        transform: translateY(-1px);
      }

      /* Profile Info Bar */
      .profile-info-bar {
        padding: 0 28px 24px;
        position: relative;
      }

      .profile-avatar-row {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        margin-top: -55px;
        margin-bottom: 16px;
        flex-wrap: wrap;
        gap: 16px;
      }

      .profile-dp-wrap {
        position: relative;
        width: 110px;
        height: 110px;
        border-radius: 50%;
        border: 4px solid var(--bg-card);
        background: var(--pink-gradient);
        box-shadow: var(--shadow-md);
        cursor: pointer;
        overflow: hidden;
        flex-shrink: 0;
      }

      .profile-dp-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .profile-dp-initials {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 40px;
        font-weight: 700;
      }

      .profile-dp-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        opacity: 0;
        transition: opacity 0.2s;
      }

      .profile-dp-wrap:hover .profile-dp-overlay {
        opacity: 1;
      }

      .profile-header-actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .btn-edit-profile {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 22px;
        border-radius: var(--radius-full);
        background: var(--pink-gradient);
        color: white;
        border: none;
        font-family: inherit;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: var(--sakura-glow);
        transition: var(--transition);
      }

      .btn-edit-profile:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 24px rgba(244, 114, 182, 0.5);
      }

      .profile-name-text {
        font-size: 24px;
        font-weight: 800;
        color: var(--text-main);
        letter-spacing: -0.4px;
      }

      .profile-handle-text {
        font-size: 14px;
        color: var(--text-muted);
        margin-bottom: 12px;
      }

      .profile-bio-box {
        font-size: 14.5px;
        color: var(--text-main);
        line-height: 1.5;
        margin-bottom: 20px;
        max-width: 680px;
        white-space: pre-line;
      }

      .profile-stats-row {
        display: flex;
        gap: 28px;
        align-items: center;
      }

      .profile-stat-box {
        display: flex;
        align-items: baseline;
        gap: 6px;
        cursor: pointer;
        transition: var(--transition);
      }

      .profile-stat-box:hover {
        transform: translateY(-1px);
      }

      .profile-stat-val {
        font-size: 18px;
        font-weight: 800;
        color: var(--text-main);
      }

      .profile-stat-lbl {
        font-size: 13px;
        color: var(--text-muted);
      }

      /* Tabs section */
      .tabs-nav {
        display: flex;
        gap: 8px;
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        padding: 6px;
        margin-bottom: 24px;
        box-shadow: var(--shadow-sm);
        overflow-x: auto;
      }

      .profile-tab {
        flex: 1;
        padding: 10px 18px;
        border-radius: var(--radius-md);
        border: none;
        background: transparent;
        color: var(--text-muted);
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: var(--transition);
        white-space: nowrap;
      }

      .profile-tab.active {
        background: var(--pink-gradient);
        color: white;
        box-shadow: var(--sakura-glow);
      }

      /* Grid of Posts */
      .posts-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }

      /* Post Card */
      .post-card {
        background: var(--bg-card);
        border-radius: var(--radius-lg);
        padding: 20px;
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow-sm);
        transition: var(--transition);
      }

      .post-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }

      .post-avatar {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--pink-gradient);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 16px;
        overflow: hidden;
      }

      .post-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .post-content {
        font-size: 15px;
        line-height: 1.6;
        color: var(--text-main);
        margin-bottom: 12px;
        white-space: pre-line;
      }

      .post-image {
        width: 100%;
        max-height: 480px;
        border-radius: var(--radius-md);
        object-fit: cover;
        cursor: pointer;
        margin-bottom: 12px;
        border: 1px solid var(--border-color);
      }

      .post-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-top: 10px;
        border-top: 1px solid var(--border-color);
      }

      .action-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border-radius: var(--radius-full);
        background: transparent;
        border: none;
        color: var(--text-muted);
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
      }

      .action-btn:hover {
        background: var(--bg-hover);
        color: var(--text-main);
      }

      /* ── Specific Edit Profile Modal Luxury Styling ── */
      .edit-profile-box {
        max-width: 540px;
      }

      .edit-media-preview-card {
        border-radius: var(--radius-md);
        overflow: hidden;
        border: 1px solid var(--border-color);
        background: var(--bg-input);
        margin-bottom: 22px;
        position: relative;
      }

      .edit-cover-preview {
        height: 120px;
        background: linear-gradient(135deg, #fbcfe8 0%, #f472b6 100%);
        position: relative;
        overflow: hidden;
      }

      [data-theme="dark"] .edit-cover-preview {
        background: linear-gradient(135deg, #1e1b2e 0%, #372045 100%);
      }

      .edit-cover-preview img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .edit-cover-btn-badge {
        position: absolute;
        top: 10px;
        right: 10px;
        background: rgba(0, 0, 0, 0.65);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(8px);
        padding: 5px 12px;
        border-radius: var(--radius-full);
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        transition: var(--transition);
      }

      .edit-cover-btn-badge:hover {
        background: rgba(0, 0, 0, 0.85);
      }

      .edit-avatar-preview-row {
        padding: 0 16px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: -36px;
      }

      .edit-avatar-preview-wrap {
        width: 74px;
        height: 74px;
        border-radius: 50%;
        border: 3px solid var(--bg-card);
        background: var(--pink-gradient);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        font-weight: 700;
        position: relative;
        cursor: pointer;
        box-shadow: var(--shadow-sm);
        overflow: hidden;
      }

      .edit-avatar-preview-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .edit-avatar-preview-wrap .avatar-overlay {
        opacity: 0;
      }

      .edit-avatar-preview-wrap:hover .avatar-overlay {
        opacity: 1;
      }

      .edit-avatar-label-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--pink-600);
        background: var(--bg-hover);
        padding: 6px 14px;
        border-radius: var(--radius-full);
        cursor: pointer;
        border: 1px solid var(--border-color);
        margin-top: 24px;
        transition: var(--transition);
      }

      [data-theme="dark"] .edit-avatar-label-btn {
        color: var(--pink-300);
      }

      .edit-avatar-label-btn:hover {
        background: var(--pink-gradient);
        color: white;
      }

      .readonly-username-badge {
        font-size: 13px;
        color: var(--text-muted);
        background: var(--bg-hover);
        padding: 2px 8px;
        border-radius: var(--radius-sm);
      }

      /* Responsive */
      @media (max-width: 768px) {
        .profile-container {
          padding: 68px 12px 80px;
        }
        .cover-area {
          height: 170px;
        }
        .profile-info-bar {
          padding: 0 16px 20px;
        }
        .profile-dp-wrap {
          width: 86px;
          height: 86px;
          margin-top: -43px;
        }
        .profile-name-text {
          font-size: 20px;
        }
        .profile-stats-row {
          gap: 18px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Hidden SVG Symbols -->
    <svg style="display: none" xmlns="http://www.w3.org/2000/svg">
      <symbol id="i-aperture" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="14.31" y1="8" x2="20.05" y2="17.94"/><line x1="9.69" y1="8" x2="21.17" y2="8"/><line x1="7.38" y1="12" x2="13.12" y2="2.06"/><line x1="9.69" y1="16" x2="3.95" y2="6.06"/><line x1="14.31" y1="16" x2="2.83" y2="16"/><line x1="16.62" y1="12" x2="10.88" y2="21.94"/></symbol>
      <symbol id="i-arrow-left" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></symbol>
      <symbol id="i-camera" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></symbol>
      <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></symbol>
      <symbol id="i-comment" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></symbol>
      <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></symbol>
    </svg>

    <!-- Top Navbar -->
    <nav class="navbar">
      <a class="nav-brand" href="feed.html">
        <div class="nav-brand-icon">
          <svg class="ico"><use href="#i-aperture" /></svg>
        </div>
        Sakura
      </a>

      <div class="nav-actions">
        <button class="nav-icon-btn" onclick="window.location='feed.html'" title="Back to Feed">
          <svg class="ico"><use href="#i-arrow-left" /></svg>
        </button>

        <button class="nav-icon-btn" onclick="toggleTheme()" title="Toggle Theme">
          <svg class="ico"><use class="theme-icon-use" href="#i-moon" /></svg>
        </button>

        <button class="btn-logout" onclick="logout()" title="Logout">
          <svg class="ico ico-sm"><use href="#i-logout" /></svg>
          <span>Logout</span>
        </button>
      </div>
    </nav>

    <!-- Profile Main Container -->
    <main class="profile-container">
      <section class="profile-hero-card">
        <!-- Cover Photo -->
        <div class="cover-area" id="coverPhotoArea">
          <img class="cover-img" id="coverPhotoImg" style="display: none;" alt="Cover" />
          <div class="cover-actions">
            <button class="cover-btn" onclick="document.getElementById('coverFileInput').click()">
              <svg class="ico ico-sm"><use href="#i-camera" /></svg>
              <span>Change Cover</span>
            </button>
            <button class="cover-btn" id="btnRemoveCover" style="display: none;" onclick="removeCoverPhoto()">
              <svg class="ico ico-sm"><use href="#i-trash" /></svg>
              <span>Remove</span>
            </button>
          </div>
          <input type="file" id="coverFileInput" accept="image/*" style="display: none;" onchange="handleCoverUpload(this)" />
        </div>

        <!-- Profile Info -->
        <div class="profile-info-bar">
          <div class="profile-avatar-row">
            <div class="profile-dp-wrap" onclick="document.getElementById('dpFileInput').click()" title="Change Profile Picture">
              <div class="profile-dp-initials" id="profileInitials">U</div>
              <img class="profile-dp-img" id="profileDpImg" style="display: none;" alt="Avatar" />
              <div class="profile-dp-overlay">
                <svg class="ico"><use href="#i-camera" /></svg>
              </div>
            </div>
            <input type="file" id="dpFileInput" accept="image/*" style="display: none;" onchange="handleDpUpload(this)" />

            <div class="profile-header-actions">
              <button class="btn-edit-profile" onclick="openEditModal()">
                <svg class="ico ico-sm"><use href="#i-edit" /></svg>
                <span>Edit Profile</span>
              </button>
            </div>
          </div>

          <h1 class="profile-name-text" id="profileName">Loading...</h1>
          <div class="profile-handle-text" id="profileHandle">@...</div>
          <p class="profile-bio-box" id="profileBio">Loading bio...</p>

          <div class="profile-stats-row">
            <div class="profile-stat-box" onclick="switchProfileTab('posts')">
              <span class="profile-stat-val" id="statPostsCount">0</span>
              <span class="profile-stat-lbl">Posts</span>
            </div>
            <div class="profile-stat-box" onclick="switchProfileTab('followers')">
              <span class="profile-stat-val" id="statFollowersCount">0</span>
              <span class="profile-stat-lbl">Followers</span>
            </div>
            <div class="profile-stat-box" onclick="switchProfileTab('following')">
              <span class="profile-stat-val" id="statFollowingCount">0</span>
              <span class="profile-stat-lbl">Following</span>
            </div>
          </div>
        </div>
      </section>

      <!-- Tabs Navigation -->
      <nav class="tabs-nav">
        <button class="profile-tab active" id="tab-posts" onclick="switchProfileTab('posts')">
          <svg class="ico ico-sm"><use href="#i-grid" /></svg>
          <span>My Posts</span>
        </button>
        <button class="profile-tab" id="tab-saved" onclick="switchProfileTab('saved')">
          <svg class="ico ico-sm"><use href="#i-bookmark" /></svg>
          <span>Saved Posts</span>
        </button>
        <button class="profile-tab" id="tab-followers" onclick="switchProfileTab('followers')">
          <svg class="ico ico-sm"><use href="#i-users" /></svg>
          <span>Followers</span>
        </button>
        <button class="profile-tab" id="tab-following" onclick="switchProfileTab('following')">
          <svg class="ico ico-sm"><use href="#i-users" /></svg>
          <span>Following</span>
        </button>
      </nav>

      <!-- Dynamic Tab Content -->
      <section id="tabContentArea">
        <div class="loading-spinner"></div>
      </section>
    </main>

    <!-- ── Full-Featured Edit Profile Modal ── -->
    <div class="modal-overlay" id="editModal" onclick="if(event.target===this)closeEditModal()">
      <div class="modal-box edit-profile-box">
        <div class="modal-header">
          <div class="modal-title">
            <svg class="ico" style="color:var(--pink-500)"><use href="#i-edit"/></svg>
            Edit Profile
          </div>
          <button class="modal-close" onclick="closeEditModal()" title="Close">
            <svg class="ico"><use href="#i-x" /></svg>
          </button>
        </div>

        <div class="modal-body">
          <!-- Visual Media Mini Card inside modal -->
          <div class="edit-media-preview-card">
            <div class="edit-cover-preview" id="modalCoverPreview">
              <img id="modalCoverImg" style="display: none;" alt="Cover preview" />
              <button type="button" class="edit-cover-btn-badge" onclick="document.getElementById('modalCoverFileInput').click()">
                <svg class="ico ico-xs"><use href="#i-camera"/></svg> Change Cover
              </button>
              <input type="file" id="modalCoverFileInput" accept="image/*" style="display: none;" onchange="handleModalCoverUpload(this)" />
            </div>

            <div class="edit-avatar-preview-row">
              <div class="edit-avatar-preview-wrap" onclick="document.getElementById('modalDpFileInput').click()" title="Change Profile Photo">
                <span id="modalAvatarInitials">U</span>
                <img id="modalAvatarImg" style="display: none;" alt="Avatar preview" />
                <div class="avatar-overlay">
                  <svg class="ico"><use href="#i-camera" /></svg>
                </div>
              </div>
              <input type="file" id="modalDpFileInput" accept="image/*" style="display: none;" onchange="handleModalDpUpload(this)" />

              <label class="edit-avatar-label-btn" for="modalDpFileInput">
                <svg class="ico ico-xs"><use href="#i-camera"/></svg> Change Photo
              </label>
            </div>
          </div>

          <!-- Full Name -->
          <div class="form-group">
            <label class="form-label" for="editFullName">
              <span>Full Name</span>
            </label>
            <input
              type="text"
              class="form-input"
              id="editFullName"
              placeholder="Your display name"
              maxlength="50"
            />
          </div>

          <!-- Username (Readonly) -->
          <div class="form-group">
            <label class="form-label">
              <span>Username</span>
              <span class="readonly-username-badge">Permanent Handle</span>
            </label>
            <input
              type="text"
              class="form-input"
              id="editUsernameDisplay"
              disabled
              style="opacity: 0.7; cursor: not-allowed; background: var(--bg-card-subtle);"
            />
          </div>

          <!-- Bio -->
          <div class="form-group" style="margin-bottom: 8px;">
            <label class="form-label" for="editBio">
              <span>Bio</span>
              <span style="font-size: 12px; color: var(--text-subtle); font-weight: 500;" id="editBioCharCount">0/160</span>
            </label>
            <textarea
              class="form-textarea"
              id="editBio"
              placeholder="Tell the world about yourself and what blooms in your mind 🌸"
              maxlength="160"
              oninput="document.getElementById('editBioCharCount').textContent = `${this.value.length}/160`"
            ></textarea>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-secondary" onclick="closeEditModal()">Cancel</button>
          <button type="button" class="btn-primary" id="btnSaveProfile" onclick="saveProfileChanges()">
            <svg class="ico ico-sm"><use href="#i-check"/></svg> Save Changes
          </button>
        </div>
      </div>
    </div>

    <!-- Lightbox Modal -->
    <div class="lightbox-modal" id="profileLightbox" onclick="this.classList.remove('open')">
      <button class="lightbox-close" onclick="document.getElementById('profileLightbox').classList.remove('open')">
        <svg class="ico"><use href="#i-x" /></svg>
      </button>
      <img id="profileLightboxImg" src="" alt="Fullscreen image" onclick="event.stopPropagation()" />
    </div>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <a class="bottom-nav-item" href="feed.html">
        <svg class="ico"><use href="#i-home" /></svg>
        <span>Home</span>
      </a>
      <a class="bottom-nav-item" href="profile.html?tab=saved">
        <svg class="ico"><use href="#i-bookmark" /></svg>
        <span>Saved</span>
      </a>
      <a class="bottom-nav-item active" href="profile.html">
        <svg class="ico"><use href="#i-user" /></svg>
        <span>Profile</span>
      </a>
    </nav>

    <script src="/js/sakura-core.js"></script>
    <script>
      checkAuth(true);
      createPetals(6);

      let profileData = null;
      let activeTab = 'posts';

      // Read tab parameter from URL if any
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('tab')) {
        activeTab = urlParams.get('tab');
      }

      async function loadMyProfile() {
        try {
          const res = await fetch('/api/auth/me', { headers: authHeaders() });
          if (!res.ok) throw new Error('Unauthorized');
          profileData = await res.json();
          setUser(profileData);
          renderProfileView(profileData);
          switchProfileTab(activeTab);
        } catch (e) {
          showToast('Could not load profile. Please log in again.', 'error');
          setTimeout(() => logout(), 1500);
        }
      }

      function renderProfileView(u) {
        document.getElementById('profileName').textContent = u.fullName || 'User';
        document.getElementById('profileHandle').textContent = '@' + (u.username || '');
        document.getElementById('profileBio').textContent = u.bio || '🌸 Living life in full blossom.';
        document.getElementById('statFollowersCount').textContent = u.followersCount || 0;
        document.getElementById('statFollowingCount').textContent = u.followingCount || 0;

        // DP
        const dpImg = document.getElementById('profileDpImg');
        const dpInitials = document.getElementById('profileInitials');
        const initials = u.fullName?.[0]?.toUpperCase() || 'U';

        if (u.profilePicture) {
          dpImg.src = u.profilePicture;
          dpImg.style.display = 'block';
          dpInitials.style.display = 'none';
        } else {
          dpImg.style.display = 'none';
          dpInitials.textContent = initials;
          dpInitials.style.display = 'flex';
        }

        // Cover
        const coverImg = document.getElementById('coverPhotoImg');
        const btnRemove = document.getElementById('btnRemoveCover');
        if (u.coverPhoto) {
          coverImg.src = u.coverPhoto;
          coverImg.style.display = 'block';
          btnRemove.style.display = 'inline-flex';
        } else {
          coverImg.style.display = 'none';
          btnRemove.style.display = 'none';
        }
      }

      // ── DP & Cover Upload ──
      async function handleDpUpload(input) {
        const file = input.files[0];
        if (!file) return;

        try {
          showToast('Processing photo...', 'info');
          const base64 = await compressImage(file, 600, 0.85);

          const res = await fetch('/api/users/profile', {
            method: 'PUT',
            headers: authHeaders(),
            body: JSON.stringify({ profilePicture: base64 }),
          });

          if (res.ok) {
            const updated = await res.json();
            profileData.profilePicture = updated.profilePicture;
            setUser(profileData);
            renderProfileView(profileData);
            showToast('Profile photo updated everywhere! ✨', 'success');
          } else {
            showToast('Failed to save profile photo.', 'error');
          }
        } catch (e) {
          showToast('Could not process image.', 'error');
        }
      }

      async function handleCoverUpload(input) {
        const file = input.files[0];
        if (!file) return;

        try {
          showToast('Processing cover...', 'info');
          const base64 = await compressImage(file, 1400, 0.85);

          const res = await fetch('/api/users/profile', {
            method: 'PUT',
            headers: authHeaders(),
            body: JSON.stringify({ coverPhoto: base64 }),
          });

          if (res.ok) {
            const updated = await res.json();
            profileData.coverPhoto = updated.coverPhoto;
            setUser(profileData);
            renderProfileView(profileData);
            showToast('Cover photo updated! 🌸', 'success');
          } else {
            showToast('Failed to save cover photo.', 'error');
          }
        } catch (e) {
          showToast('Could not process image.', 'error');
        }
      }

      async function removeCoverPhoto() {
        if (!confirm('Remove cover photo?')) return;
        try {
          const res = await fetch('/api/users/profile', {
            method: 'PUT',
            headers: authHeaders(),
            body: JSON.stringify({ coverPhoto: '' }),
          });

          if (res.ok) {
            profileData.coverPhoto = '';
            setUser(profileData);
            renderProfileView(profileData);
            showToast('Cover photo removed', 'info');
          }
        } catch (e) {}
      }

      // Modal specific photo changes with live preview
      async function handleModalDpUpload(input) {
        const file = input.files[0];
        if (!file) return;
        try {
          showToast('Compressing avatar...', 'info');
          const base64 = await compressImage(file, 600, 0.85);
          const avatarImg = document.getElementById('modalAvatarImg');
          const initials = document.getElementById('modalAvatarInitials');
          avatarImg.src = base64;
          avatarImg.style.display = 'block';
          initials.style.display = 'none';

          // Auto persist to backend
          await fetch('/api/users/profile', {
            method: 'PUT',
            headers: authHeaders(),
            body: JSON.stringify({ profilePicture: base64 }),
          });
          profileData.profilePicture = base64;
          setUser(profileData);
          renderProfileView(profileData);
          showToast('Photo changed! 🌸', 'success');
        } catch (e) {}
      }

      async function handleModalCoverUpload(input) {
        const file = input.files[0];
        if (!file) return;
        try {
          showToast('Compressing cover...', 'info');
          const base64 = await compressImage(file, 1400, 0.85);
          const coverImg = document.getElementById('modalCoverImg');
          coverImg.src = base64;
          coverImg.style.display = 'block';

          // Auto persist to backend
          await fetch('/api/users/profile', {
            method: 'PUT',
            headers: authHeaders(),
            body: JSON.stringify({ coverPhoto: base64 }),
          });
          profileData.coverPhoto = base64;
          setUser(profileData);
          renderProfileView(profileData);
          showToast('Cover changed! ✨', 'success');
        } catch (e) {}
      }

      // ── Switch Tabs ──
      function switchProfileTab(tab) {
        activeTab = tab;
        ['posts', 'saved', 'followers', 'following'].forEach((t) => {
          const btn = document.getElementById(`tab-${t}`);
          if (btn) btn.classList.toggle('active', t === tab);
        });

        if (tab === 'posts') loadMyPosts();
        if (tab === 'saved') loadSavedPosts();
        if (tab === 'followers') loadFollowTab('followers');
        if (tab === 'following') loadFollowTab('following');
      }

      // ── Load My Posts ──
      async function loadMyPosts() {
        const area = document.getElementById('tabContentArea');
        area.innerHTML = '<div class="loading-spinner"></div>';

        try {
          const res = await fetch(`/api/posts/user/${profileData._id}`, { headers: authHeaders() });
          const posts = await res.json();
          document.getElementById('statPostsCount').textContent = posts.length;

          if (!posts.length) {
            area.innerHTML = '<div style="background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-lg);padding:40px;text-align:center;color:var(--text-muted);">No posts shared yet. Go to Home Feed to blossom! 🌸</div>';
            return;
          }

          renderPostsGrid(posts, true);
        } catch (e) {
          area.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:30px;">Could not load posts.</div>';
        }
      }

      // ── Load Saved Posts ──
      async function loadSavedPosts() {
        const area = document.getElementById('tabContentArea');
        area.innerHTML = '<div class="loading-spinner"></div>';

        try {
          const res = await fetch('/api/posts/bookmarks', { headers: authHeaders() });
          const posts = await res.json();

          if (!posts.length) {
            area.innerHTML = '<div style="background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-lg);padding:40px;text-align:center;color:var(--text-muted);">No saved posts yet. Bookmark posts in your feed to view them here! 🔖</div>';
            return;
          }

          renderPostsGrid(posts, false);
        } catch (e) {
          area.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:30px;">Could not load saved posts.</div>';
        }
      }

      function renderPostsGrid(posts, allowDelete) {
        const area = document.getElementById('tabContentArea');
        area.innerHTML = `
          <div class="posts-grid">
            ${posts
              .map((p) => {
                const author = p.user || {};
                const initials = author.fullName?.[0]?.toUpperCase() || 'U';
                const avatar = author.profilePicture
                  ? `<img src="${author.profilePicture}" alt="${initials}">`
                  : initials;

                return `
                  <article class="post-card" id="post-${p._id}">
                    <div class="post-header">
                      <div class="post-avatar" onclick="window.location='user-profile.html?id=${author._id}'">
                        ${avatar}
                      </div>
                      <div style="flex: 1;">
                        <div style="font-weight: 700; font-size: 14.5px;">${author.fullName || 'User'}</div>
                        <div style="font-size: 12px; color: var(--text-subtle);">${timeAgo(p.createdAt)}</div>
                      </div>
                      ${
                        allowDelete
                          ? `<button class="action-btn" onclick="deleteMyPost('${p._id}')" title="Delete" style="color: #ef4444;"><svg class="ico ico-sm"><use href="#i-trash"/></svg></button>`
                          : ''
                      }
                    </div>
                    ${p.content ? `<div class="post-content">${p.content}</div>` : ''}
                    ${p.image ? `<img class="post-image" src="${p.image}" alt="Post image" onclick="openProfileLightbox('${p.image}')"/>` : ''}
                    <div class="post-actions">
                      <span class="action-btn">
                        <svg class="ico ico-sm" style="color:var(--pink-500);fill:var(--pink-500);"><use href="#i-heart"/></svg>
                        <span>${p.likesCount || 0}</span>
                      </span>
                      <span class="action-btn">
                        <svg class="ico ico-sm"><use href="#i-comment"/></svg>
                        <span>${p.commentsCount || 0}</span>
                      </span>
                    </div>
                  </article>
                `;
              })
              .join('')}
          </div>
        `;
      }

      async function deleteMyPost(postId) {
        if (!confirm('Are you sure you want to delete this post?')) return;
        try {
          const res = await fetch(`/api/posts/${postId}`, {
            method: 'DELETE',
            headers: authHeaders(),
          });
          if (res.ok) {
            showToast('Post deleted', 'info');
            loadMyPosts();
          }
        } catch (e) {}
      }

      // ── Followers / Following Tab ──
      async function loadFollowTab(type) {
        const area = document.getElementById('tabContentArea');
        area.innerHTML = '<div class="loading-spinner"></div>';

        try {
          const res = await fetch(`/api/users/${profileData._id}/${type}`, { headers: authHeaders() });
          const list = await res.json();

          if (!list.length) {
            area.innerHTML = `<div style="background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-lg);padding:40px;text-align:center;color:var(--text-muted);">No ${type} found.</div>`;
            return;
          }

          area.innerHTML = `
            <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px;">
              ${list
                .map((u) => {
                  const initials = u.fullName?.[0]?.toUpperCase() || 'U';
                  const avatar = u.profilePicture ? `<img src="${u.profilePicture}" alt="${initials}">` : initials;
                  return `
                    <div style="display: flex; align-items: center; gap: 12px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 14px; cursor: pointer;" onclick="window.location='user-profile.html?id=${u._id}'">
                      <div class="post-avatar">${avatar}</div>
                      <div style="flex: 1; min-width: 0;">
                        <div style="font-weight: 700; font-size: 14px; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${u.fullName}</div>
                        <div style="font-size: 12px; color: var(--text-muted);">@${u.username}</div>
                      </div>
                    </div>
                  `;
                })
                .join('')}
            </div>
          `;
        } catch (e) {
          area.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:30px;">Could not load list.</div>';
        }
      }

      // ── Edit Profile Modal Controls ──
      function openEditModal() {
        if (!profileData) return;
        document.getElementById('editFullName').value = profileData.fullName || '';
        document.getElementById('editUsernameDisplay').value = '@' + (profileData.username || '');
        document.getElementById('editBio').value = profileData.bio || '';
        document.getElementById('editBioCharCount').textContent = `${(profileData.bio || '').length}/160`;

        // Sync modal mini preview images
        const avatarImg = document.getElementById('modalAvatarImg');
        const initials = document.getElementById('modalAvatarInitials');
        const userInitials = profileData.fullName?.[0]?.toUpperCase() || 'U';

        if (profileData.profilePicture) {
          avatarImg.src = profileData.profilePicture;
          avatarImg.style.display = 'block';
          initials.style.display = 'none';
        } else {
          avatarImg.style.display = 'none';
          initials.textContent = userInitials;
          initials.style.display = 'flex';
        }

        const coverImg = document.getElementById('modalCoverImg');
        if (profileData.coverPhoto) {
          coverImg.src = profileData.coverPhoto;
          coverImg.style.display = 'block';
        } else {
          coverImg.style.display = 'none';
        }

        document.getElementById('editModal').classList.add('open');
      }

      function closeEditModal() {
        document.getElementById('editModal').classList.remove('open');
      }

      async function saveProfileChanges() {
        const fullName = document.getElementById('editFullName').value.trim();
        const bio = document.getElementById('editBio').value.trim();

        if (!fullName) {
          showToast('Name cannot be empty', 'error');
          return;
        }

        const btn = document.getElementById('btnSaveProfile');
        btn.disabled = true;
        btn.innerHTML = `<div class="loading-spinner" style="width:16px;height:16px;border-width:2px;margin:0 4px"></div> Saving...`;

        try {
          const res = await fetch('/api/users/profile', {
            method: 'PUT',
            headers: authHeaders(),
            body: JSON.stringify({ fullName, bio }),
          });

          if (res.ok) {
            const updated = await res.json();
            profileData.fullName = updated.fullName;
            profileData.bio = updated.bio;
            setUser(profileData);
            renderProfileView(profileData);
            closeEditModal();
            showToast('Profile updated successfully! ✨', 'success');
          } else {
            showToast('Failed to update profile', 'error');
          }
        } catch (e) {
          showToast('Network error while updating profile', 'error');
        } finally {
          btn.disabled = false;
          btn.innerHTML = `<svg class="ico ico-sm"><use href="#i-check"/></svg> Save Changes`;
        }
      }

      function openProfileLightbox(src) {
        document.getElementById('profileLightboxImg').src = src;
        document.getElementById('profileLightbox').classList.add('open');
      }

      // Initial boot
      loadMyProfile();
    </script>
  </body>
</html>
